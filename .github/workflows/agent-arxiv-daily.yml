name: Run Arxiv Papers Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0/12 * * *"

env:
  GITHUB_USER_NAME: limafang
  GITHUB_USER_EMAIL: azula_fire@163.com

permissions:
  contents: write

concurrency:
  group: agent-arxiv-updates
  cancel-in-progress: false

jobs:
  build:
    name: update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python Env
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run daily arxiv
        run: python daily_arxiv.py
        env:
          DASHSCOPE_API_KEY: ${{ secrets.QWEN_API_KEY }}

      - name: Commit and push updates
        run: |
          if git diff --quiet -- README.md docs/agent-arxiv-daily.json; then
            echo "No paper updates to commit"
            exit 0
          fi
          git config user.name "$GITHUB_USER_NAME"
          git config user.email "$GITHUB_USER_EMAIL"
          git add README.md docs/agent-arxiv-daily.json
          git commit -m "Github Action Automatic Update agent Arxiv Papers"
          git pull --rebase origin main
          git push origin HEAD:main
