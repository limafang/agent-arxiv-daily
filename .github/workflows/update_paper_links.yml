name: Run Update Paper Links Weekly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

env:
  GITHUB_USER_NAME: limafang
  GITHUB_USER_EMAIL: azula_fire@163.com

permissions:
  contents: write

concurrency:
  group: agent-arxiv-updates
  cancel-in-progress: false

jobs:
  build:
    name: update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python Env
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update paper links
        run: python daily_arxiv.py --update_paper_links

      - name: Commit and push updates
        run: |
          if git diff --quiet -- README.md docs/agent-arxiv-daily.json; then
            echo "No link updates to commit"
            exit 0
          fi
          git config user.name "$GITHUB_USER_NAME"
          git config user.email "$GITHUB_USER_EMAIL"
          git add README.md docs/agent-arxiv-daily.json
          git commit -m "Github Action Automatic Update Agent Arxiv Papers"
          git pull --rebase origin main
          git push origin HEAD:main
